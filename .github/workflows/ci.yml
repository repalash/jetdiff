name: ci
on:
  push:
  pull_request:
  # started by vendor.yml on a Dependabot branch it committed to
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # index.html and worker/headers.js name the installed libraries (on a Dependabot branch, vendor.yml commits that)
      - run: npm run vendor -- --check
      - run: npx playwright install --with-deps chromium
      - run: npm test

  # jetdiff.com: the Cloudflare Worker, deployed from main once the tests pass
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: deploy
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      APP_CLIENT_SECRET: ${{ secrets.APP_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # the build copies the libraries from node_modules
      - run: npm ci
      - if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::No CLOUDFLARE_API_TOKEN secret in this repository, so nothing is deployed"
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm run deploy
      # the GitHub App's client secret (Sign in with GitHub), when the repository has it
      - if: env.CLOUDFLARE_API_TOKEN != '' && env.APP_CLIENT_SECRET != ''
        run: printf '%s' "$APP_CLIENT_SECRET" | npx wrangler@4.158.0 secret put GITHUB_CLIENT_SECRET
